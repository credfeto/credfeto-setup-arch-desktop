--- # Test: run the bats shell test suite against the repo's shell scripts
name: "Test: Shell Scripts"

on:
  pull_request:
    branches:
      - "main"

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # @@required: main
  shell-tests:
    runs-on: ubuntu-latest
    # Backstop only: a job timeout cancels the run, which skips the report step.
    timeout-minutes: 15

    env:
      BATS_RESULTS: "bats-results.tap"
      NVM_REPOSITORY: "https://github.com/nvm-sh/nvm"
      # Fetched by commit, so the content is pinned.
      NVM_COMMIT: "a885b885fef16fac4bc544188fb25e9e37ae83e8" # v0.40.8

    steps:
      - name: "Initialise Workspace"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE"

      - name: "Set Active Environment"
        shell: bash
        run: |
          {
            echo "ACTIVE_RUNNER_NAME=$RUNNER_NAME"
            echo "ACTIVE_HOSTNAME=$HOSTNAME"
            echo "ACTIVE_USER=$USER"
          } >> "$GITHUB_ENV"

      - name: "Checkout Source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: "Install test tools"
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats dash bash-completion util-linux

      - name: "Cache nvm checkout"
        id: nvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "${{runner.temp}}/nvm"
          key: "nvm-${{env.NVM_COMMIT}}"

      - name: "Install nvm"
        shell: bash
        run: |
          nvm_source="${RUNNER_TEMP}/nvm"
          if [ "${NVM_CACHE_HIT}" != "true" ]; then
            git init --quiet "${nvm_source}"
            git -C "${nvm_source}" fetch --quiet --depth 1 "${NVM_REPOSITORY}" "${NVM_COMMIT}"
            git -C "${nvm_source}" -c advice.detachedHead=false checkout --quiet FETCH_HEAD
          fi

          sudo install -d -m 0755 /usr/share/nvm
          sudo install -m 0644 "${nvm_source}/nvm.sh" /usr/share/nvm/nvm.sh
          sudo install -m 0755 "${nvm_source}/nvm-exec" /usr/share/nvm/nvm-exec
          sudo install -m 0644 "${nvm_source}/bash_completion" /usr/share/nvm/bash_completion
        env:
          NVM_CACHE_HIT: "${{steps.nvm-cache.outputs.cache-hit}}"

      - name: "Run shell tests"
        id: run-tests
        # Backstop only: timeout stops bats first so its exit status is recorded; a step timeout records none.
        timeout-minutes: 11
        shell: bash
        # The cat formatter is TAP plus a "begin" line as each test starts, which names a test bats never finished.
        run: |
          status=0
          timeout --kill-after=10 600 bats --recursive --formatter cat test/ | tee "${RUNNER_TEMP}/${BATS_RESULTS}" || status=$?
          echo "exit-status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: "Report shell test results"
        if: ${{ !cancelled() }}
        uses: ./.github/actions/report-bats-results
        with:
          results-file: "${{runner.temp}}/${{env.BATS_RESULTS}}"
          bats-outcome: "${{steps.run-tests.outcome}}"
          bats-exit-status: "${{steps.run-tests.outputs.exit-status}}"
