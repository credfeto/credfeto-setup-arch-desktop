# The .NET environment every session gets, and the only place it is defined.
# install.d/dotnet-environment generates each file a kind of session reads
# from this list when the SDK is installed:
#   /etc/environment.d/60-dotnet.conf  systemd user sessions and their units
#   /etc/security/pam_env.conf         SSH and console logins (a marked block)
#   /etc/profile.d/60_dotnet.sh        login shells, including the dev-update
#                                      unit's `sh -l`
#   /etc/bash.bashrc.d/60_dotnet.sh    every interactive bash, through the
#                                      bash.bashrc.d loader
# DOTNET_ROOT is the SDK the files are installed and removed with, and is
# also added to the end of PATH, except through pam_env, which cannot append
# to PATH; the /usr/local/bin/dotnet link covers those logins instead.
#
# One NAME=value line per variable; blank lines and lines starting with #
# are skipped. The value is written exactly as given into every one of those
# files, so it may only hold letters, digits and . _ / : + - (no quotes,
# spaces or $).
DOTNET_ROOT=/usr/share/dotnet
DOTNET_NOLOGO=true
DOTNET_PRINT_TELEMETRY_MESSAGE=false
DOTNET_JitCollect64BitCounts=1
DOTNET_ReadyToRun=0
DOTNET_TC_QuickJitForLoops=1
DOTNET_TC_CallCountingDelayMs=0
DOTNET_TieredPGO=1
MSBUILDTERMINALLOGGER=auto
SuppressNETCoreSdkPreviewMessage=true
